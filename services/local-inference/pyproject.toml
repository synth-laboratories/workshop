[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-local-inference"
version = "0.1.0"
description = "Loopback model manager and OpenAI-compatible proxy for local Laguna XS 2.1."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "uvicorn>=0.32"
]

[project.optional-dependencies]
mlx = [
  "mlx-vlm>=0.6.3; platform_system == 'Darwin' and platform_machine == 'arm64'"
]
test = ["pytest>=8"]

[project.scripts]
synth-local-inference = "synth_inference.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synth_inference*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
