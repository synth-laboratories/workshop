[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-environment-qa"
version = "0.3.0"
description = "Durable Harbor environment-QA DAG with automated and human review"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "python-dotenv>=1,<2"]

[project.scripts]
workshop-environment-qa = "environment_qa.__main__:main"

[tool.setuptools]
packages = ["environment_qa"]

[tool.setuptools.data-files]
"share/workshop-environment-qa/web" = ["web/index.html", "web/app.js", "web/style.css"]
