[project]
name = "synth-laguna-daemon"
version = "0.1.0"
description = "OpenAI-compatible Laguna XS 2.1 loopback for Synth Desktop"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "huggingface-hub>=0.26",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
mlx = [
  "mlx>=0.26; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.26; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
synth-laguna-daemon = "laguna_daemon.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["laguna_daemon*"]
