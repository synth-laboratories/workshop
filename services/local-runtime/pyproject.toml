[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synth-local-runtime"
version = "0.1.0"
description = "Local session, event, and adapter daemon for Synth Desktop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
synth-local-runtime = "synth_local_runtime.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
