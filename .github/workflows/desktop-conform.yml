# Keep the public release branch's deploy-independent conformance gate.
name: Desktop conform

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  conform:
    name: Conform counts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Print SynthStyle CONFORM CHECK counts
        run: ./scripts/desktop.sh conform

      - name: Reject new app.css style literals
        working-directory: apps/synth_desktop
        run: npm run lint:app-css
