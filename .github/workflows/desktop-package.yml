name: Desktop package

on:
  push:
    branches: [codex/v010-package-ci, codex/v010-macos-browser-return, codex/v010-importer-signing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      SYNTH_APP_SIGN_IDENTITY: '-'
      SYNTH_SIGN_IDENTITY: '-'
      APPLE_SIGNING_IDENTITY: '-'
      RUSTUP_TOOLCHAIN: '1.97.1'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.7.0'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          python-version: '3.11'
      - name: Configure public build prerequisites
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          rustup toolchain install 1.97.1 --profile minimal
          uv python install 3.11
          dirname "$(uv python find 3.11)" >> "$GITHUB_PATH"
          command -v rg >/dev/null || brew install ripgrep
          command -v jq >/dev/null || brew install jq
      - name: Validate tag and install locked dependencies
        shell: bash
        run: |
          ./scripts/install.sh --check
          version="$(node -p "require('./apps/synth_desktop/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || exit 1
          fi
          npm ci
          npx playwright install chromium
      - name: Packaging contract regressions
        run: |
          node --test apps/synth_desktop/tests/release-build-contract.test.mjs apps/synth_desktop/tests/template-evidence-pages.test.mjs
          python3 scripts/test-verify-accepted-desktop.py
      - name: Build from public pinned sources and package
        shell: bash
        run: |
          source scripts/prepare-build-sources.sh
          ./scripts/build.sh
      - name: Upload immutable package evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workshop-macos-arm64
          path: dist/Synth-Workshop-*
          if-no-files-found: error
          retention-days: 14
