[package]
name = "synth-desktop"
version = "0.2.0"
description = "Synth Desktop Tauri host"
edition = "2021"
default-run = "synth-desktop"

[lib]
name = "synth_desktop_lib"
# Desktop-only app: the bin links the rlib. staticlib/cdylib are mobile-template
# artifacts and each forces a full extra codegen+link pass of the whole lib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
futures-util = "0.3"
fs2 = "0.4"
# The credential proxy: a loopback Responses endpoint that holds the Synth key
# so `codex app-server` never receives it. All three already build as reqwest
# dependencies; only the server-side features are new.
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
libc = "0.2"
mermaid-to-svg = { path = "third_party/mermaid-to-svg" }
portable-pty = "0.9"
png = "0.17"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Wave 2 boundary codegen (tauri-specta). Pin RC versions together — specta
# RCs are not semver-stable across minor bumps.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
toml = "0.8"
tauri = { version = "2", features = ["specta"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "synth-visuals-mcp"
path = "src/bin/synth_visuals_mcp.rs"

[[bin]]
name = "synth-containers-mcp"
path = "src/bin/synth_containers_mcp.rs"

[[bin]]
name = "synth-optimizers-mcp"
path = "src/bin/synth_optimizers_mcp.rs"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

# Local installs rebuild the whole app crate for any one-line change; release
# incremental turns that ~35s codegen pass into a few seconds. Cargo applies
# incremental only to workspace crates, so registry deps stay sccache-cached.
[profile.release]
incremental = true
