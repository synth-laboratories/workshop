# Banking77 GEPA against the local Laguna model.
#
# The proposer's base URL always comes from Workshop's host provider proxy, not
# from this file, so the only lever here is the provider name. `local-laguna`
# is a provider class Workshop already knows; if its proxy has a local route,
# this search costs nothing and needs no external credit.
#
# Held-out seeds are disjoint from train and never shown to the search. GEPA
# refuses a recipe with either pool empty, which is the point: selecting on the
# seeds you report makes the reported number meaningless.
id = "gepa.banking77.local.v1"
algorithm = "gepa"
title = "Banking77 · GEPA on local Laguna"
container = "banking77"
provider = "local-laguna"
model = "poolside/Laguna-XS-2.1-NVFP4-mlx"
proposer_model = "poolside/Laguna-XS-2.1-NVFP4-mlx"
locality = "container"
credential_mode = "proxy"
family = "banking77"
harness = "classify"
policy_config = "classify"
requires_credential_advertisement = false
concurrency = 2
minibatch_size = 2
train_seeds = [0, 1, 2, 3]
heldout_seeds = [100, 101]

[policy]
# Admission refuses a provider-backed recipe without an explicit per-rollout
# call and step cap: an unbounded loop against any provider, local or not, is
# exactly what these ceilings exist to prevent.
max_calls = 4
max_steps = 4

[bounds]
# A QA search proves the surfaces render, not that the prompt improved.
max_cost_usd = 0.50
max_total_rollouts = 16
max_generations = 2

[event_stream]
poll_interval_ms = 100
page_limit = 200
max_events_per_rollout = 2000
