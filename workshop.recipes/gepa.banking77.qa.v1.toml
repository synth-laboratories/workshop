# Banking77 GEPA prompt search, sized for a QA loop rather than a result.
#
# The `classify` policy is the paid one the container advertises alongside
# `dataset_gold`; GEPA needs a policy it can actually rewrite, so the gold
# path -- which replays the environment label and cannot be improved -- is not
# a candidate here.
#
# Held-out seeds are disjoint from train and are never shown to the search.
# GEPA refuses a recipe with either pool empty, which is the point: a search
# that selects on the same seeds it reports would produce a number that means
# nothing.
id = "gepa.banking77.qa.v1"
algorithm = "gepa"
title = "Banking77 · GEPA QA search"
container = "banking77"
provider = "openrouter"
model = "meta-llama/llama-3.1-8b-instruct"
proposer_model = "meta-llama/llama-3.1-8b-instruct"
locality = "container"
credential_mode = "proxy"
family = "banking77"
harness = "classify"
policy_config = "classify"
requires_credential_advertisement = false
concurrency = 2
minibatch_size = 2
train_seeds = [0, 1, 2, 3]
heldout_seeds = [100, 101]

[bounds]
# A QA search proves the surfaces render, not that the prompt improved. Bounds
# are set so an unattended loop cannot spend more than the evidence is worth.
max_cost_usd = 1.50
max_total_rollouts = 24
max_generations = 2

[event_stream]
poll_interval_ms = 100
page_limit = 200
max_events_per_rollout = 2000
