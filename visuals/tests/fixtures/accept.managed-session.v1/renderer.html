<!doctype html><html><head><meta charset="utf-8"><style>body{font:18px system-ui;padding:24px;color:#192a38;background:#f5f7f9}button{font:inherit;padding:12px}output{display:block;font-size:48px;margin:24px 0}</style></head><body>
<h1>Managed logical step</h1><p>Networkless acceptance fixture. Human and MCP actions share one committed state.</p>
<output aria-label="Logical step">Connecting</output><button disabled>Next logical step</button>
<script>
let state, registered=false;
function send(operation,fields){parent.postMessage({type:'synth.visual.session.request.v1',requestId:String(Date.now())+Math.random(),operation,...fields},'*');}
addEventListener('message',event=>{
 if(event.source!==parent||event.data?.type!=='synth.visual.session.state.v1')return;
 state=event.data.state;
 if(!registered){registered=true;send('register',{controls:[{id:'frame.step',label:'Logical step',type:'number',minimum:0,maximum:10}],defaults:{'frame.step':0}});}
 const step=state.values['frame.step'];
 document.querySelector('output').textContent=step===undefined?'Connecting':String(step);
 document.querySelector('button').disabled=step===undefined||step>=10;
});
document.querySelector('button').onclick=()=>send('act',{action:{id:String(Date.now())+Math.random(),kind:'presentation.set',target:{id:'frame.step'},expectedStateVersion:state.stateVersion,payload:{value:state.values['frame.step']+1}}});
</script></body></html>
