# Workshop product-telemetry contract — the single source of truth for the
# event dictionary, consent policy version, retention, and sync eligibility.
#
# Consumers:
#   - Desktop Rust embeds this file (src-tauri/src/telemetry/contract.rs) and
#     refuses any event or property not declared here.
#   - Backend mirrors the sync-eligible event names and classes in
#     app/api/v1/routes_product.py (PRODUCT_REGISTRY["workshop"]). Update both
#     in the same change; the backend list must never be broader than this file.
#
# Rules this file cannot relax (enforced in code regardless of contents):
#   - No prompts, traces, filenames, paths, secrets, or free-form strings.
#   - Nested property values are refused.
#   - Events with sync = "local_only" never leave the device, consent or not.
#   - Optional events record only while product analytics is enabled, and sync
#     only after explicit consent (collection_policy_version below).
#
# Bumping collection_policy_version re-triggers the consent ask on every
# install; bump it whenever what is collected or where it goes changes.

schema = 1
dictionary_version = "workshop.product-telemetry.v2"
collection_policy_version = "workshop.product-telemetry.policy.v2"
retention_days_optional = 90
retention_days_essential = 365

# Attached to every accepted event by the host. Not product content.
envelope_properties = [
  "schema_version",
  "app_version",
  "release_channel",
  "platform",
  "architecture",
  "install_id",
  "collection_policy_version",
  "outcome",
  "duration_ms",
  "error_class",
  "workflow_family",
]

# class: funnel | product | reliability — the family a rollup groups by.
# sensitivity: optional (consent-gated, deleted on opt-out/sign-out)
#            | essential (always recorded locally)
# sync: eligible | local_only — whether the flusher may ever ship it.

[[event]]
name = "download_initiated"
purpose = "Count signed-artifact download starts from the public funnel."
owner = "workshop-distribution"
class = "funnel"
sensitivity = "optional"
sync = "eligible"
properties = ["release_channel", "platform", "architecture"]

[[event]]
name = "download_served"
purpose = "Count successful signed-artifact delivery, distinct from download clicks."
owner = "workshop-distribution"
class = "funnel"
sensitivity = "optional"
sync = "eligible"
properties = ["release_channel", "platform", "architecture"]

